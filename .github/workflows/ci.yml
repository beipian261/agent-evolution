name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-check:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装质量检查工具
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint

      - name: 运行 flake8 检查
        run: |
          flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: 运行 pylint 检查
        run: |
          pylint scripts/ --output-format=text --disable=C0111,R0903 || true
        continue-on-error: true

  unit-tests:
    name: 单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11']
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install pandas numpy

      - name: 检查 Python 版本
        run: |
          python --version

      - name: 运行测试
        run: |
          python -m pytest scripts/ -v --tb=short --cov=scripts --cov-report=xml --cov-report=html || echo "No tests found"
        continue-on-error: true

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

      - name: 上传 XML 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  test-optional-deps:
    name: 可选依赖测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装所有可选依赖
        run: |
          python -m pip install --upgrade pip
          pip install chromadb prophet pandas pytest pytest-cov
        continue-on-error: true

      - name: 验证 ChromaDB 导入
        run: python -c "import chromadb; print('ChromaDB version:', chromadb.__version__)" || echo "ChromaDB not available"
        continue-on-error: true

      - name: 验证 Prophet 导入
        run: python -c "from prophet import Prophet; print('Prophet imported successfully')" || echo "Prophet not available"
        continue-on-error: true

      - name: 验证 Pandas 导入
        run: python -c "import pandas; print('Pandas version:', pandas.__version__)"

      - name: 运行完整测试套件
        run: |
          python -m pytest scripts/ -v --tb=short || echo "Test suite completed"
        continue-on-error: true

  lint:
    name: 代码风格检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Black 和 isort
        run: |
          python -m pip install --upgrade pip
          pip install black isort

      - name: 检查代码格式 (Black)
        run: |
          black --check scripts/ --diff || true

      - name: 检查导入排序 (isort)
        run: |
          isort --check-only --diff scripts/ || true

  build-check:
    name: 构建检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: 验证 Python 脚本语法
        run: |
          for script in scripts/*.py; do
            python -m py_compile "$script" && echo "✓ $script" || echo "✗ $script"
          done

      - name: 验证 Shell 脚本语法
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" && echo "✓ $script" || echo "✗ $script"
          done
